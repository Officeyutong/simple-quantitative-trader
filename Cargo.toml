[workspace]
members = [
    ".",
    "rpc-types",
    "web",
    "crates/strategy-api",
    "crates/strategy-web-kit",
    "crates/strategy-catalog-backend",
    "crates/strategy-catalog-web",
    "strategies/moving-average/model",
    "strategies/moving-average/engine",
    "strategies/moving-average/web",
    "strategies/close-threshold/model",
    "strategies/close-threshold/engine",
    "strategies/close-threshold/web",
    "strategies/paper-round-trip/model",
    "strategies/paper-round-trip/engine",
    "strategies/paper-round-trip/web",
]
resolver = "3"

[package]
name = "simple-quantitative-trader"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
duckdb = { version = "1", features = ["bundled", "chrono", "uuid"] }
fs2 = "0.4"
futures = "0.3"
http = "1"
ibapi = "3.3"
jsonrpsee = { version = "=0.26.0", features = ["server", "http-client"] }
quant-rpc-types = { path = "rpc-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["validate-request"] }
uuid = { version = "1", features = ["serde", "v7"] }
strategy-api = { path = "crates/strategy-api" }
strategy-catalog-backend = { path = "crates/strategy-catalog-backend" }

[dev-dependencies]
tempfile = "3"
