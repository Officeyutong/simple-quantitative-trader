[package]
name = "quant-rpc-types"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
jsonrpsee = { version = "=0.26.0", features = ["client-core", "macros", "server-core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
